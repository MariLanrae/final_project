# .github/workflows/ci.yml

name: CI/CD Pipeline

# Запускать при push в ветку main и при создании Pull Request
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Определение заданий (jobs)
jobs:
  # Задание для тестирования
  test:
    runs-on: ubuntu-latest  # Используем виртуальную машину Ubuntu

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Устанавливаем Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.3'  # Укажите версию, которую используете

      # 3. Устанавливаем зависимости
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Запускаем модульные тесты
      - name: Run unit tests
        run: |
          python -m unittest test_unit.py -v

      # 5. Запускаем интеграционные тесты
      - name: Run integration tests
        run: |
          python -m pytest test_integration.py -v

    # 6. (Опционально) Запускаем системные тесты
    #    Обратите внимание: Selenium может не работать в CI без headless-режима и правильных настроек
    # - name: Run system tests
    #   run: |
    #     python -m pytest test_system.py -v

